<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Checker</title>
<style>
  body { font-family: Arial, sans-serif; background:#f0f2f5; display:flex; justify-content:center; padding-top:60px; }
  .box { background:#fff; padding:24px; border-radius:12px; width:320px; box-shadow:0 2px 10px rgba(0,0,0,.1); }
  input { width:100%; padding:10px; font-size:16px; box-sizing:border-box; }
  #bar { height:8px; margin-top:12px; border-radius:4px; background:#ddd; }
  #msg { margin-top:10px; font-weight:bold; }
</style>
</head>
<body>
<div class="box">
  <h2>Password Checker</h2>
  <input type="password" id="pw" placeholder="Enter password">
  <div id="bar"></div>
  <div id="msg"></div>
</div>
<script>
const pw = document.getElementById("pw");
const bar = document.getElementById("bar");
const msg = document.getElementById("msg");

pw.addEventListener("input", () => {
  const v = pw.value;
  let score = 0;
  if (v.length >= 8) score++;
  if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
  if (/\d/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;

  const levels = [
    ["", "#ddd", "0%"],
    ["Weak", "red", "25%"],
    ["Fair", "orange", "50%"],
    ["Good", "gold", "75%"],
    ["Strong", "green", "100%"]
  ];
  const [text, color, width] = levels[v ? Math.max(score, 1) : 0];
  msg.textContent = text;
  msg.style.color = color;
  bar.style.background = `linear-gradient(to right, ${color} ${width}, #ddd ${width})`;
});
</script>
</body>
</html>
